[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godlike-seo-toolkit"
version = "3.3.2"
description = "Deterministic, Evidence-Based SEO Diagnostic & Audit Engine for Developers and AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Prasad Shinde", email = "bot@godlike-seo.dev" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.28.0",
    "certifi>=2024.0.0",
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
godlike-seo = "godlike_seo.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["godlike_seo*"]
